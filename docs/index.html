<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stays near JR Shinjuku · Nov 15 2026 · under ¥20k</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<aside id="filters" class="box">
  <div class="filters-head">
    <h1>Near JR Shinjuku · Nov 15, 1 night</h1>
    <button id="filters-toggle" class="icon-btn" title="Show or hide filters" aria-expanded="true">–</button>
  </div>
  <div id="filters-body">
    <p class="count"><b id="count">0</b> of <span id="total">0</span> stays shown<br><span class="muted">2 adults, 1 room, within 2 km of JR Shinjuku. Prices are the room total for the night, tax included.</span></p>
    <label class="row" for="price">Max price <b id="price-val"></b></label>
    <input id="price" type="range" min="7000" max="20000" step="500" value="20000">
    <label class="row" for="rating">Min rating <b id="rating-val"></b></label>
    <input id="rating" type="range" min="2.5" max="4.5" step="0.1" value="2.5">
    <label class="row" for="dist">Distance <b id="dist-val"></b></label>
    <input id="dist" type="range" min="0.5" max="2" step="0.1" value="2">
    <div class="row">Meals</div>
    <div class="seg" id="meals">
      <label><input type="radio" name="meals" value="any" checked><span>Any</span></label>
      <label><input type="radio" name="meals" value="Room only"><span>Room only</span></label>
      <label><input type="radio" name="meals" value="Breakfast"><span>Breakfast</span></label>
    </div>
    <label class="check"><input id="private" type="checkbox"><span>Private rooms only <span class="muted">(no capsules or dorms)</span></span></label>
    <label class="check"><input id="mixed" type="checkbox"><span>Hide women-only and men-only plans</span></label>
    <div class="row">Type</div>
    <div class="chips" id="types"></div>
    <div class="two">
      <label>Color pins by<select id="colorby"><option value="type">Type</option><option value="price">Price</option></select></label>
    </div>
    <input id="q" type="search" placeholder="Search name or area">
    <div id="legend" class="legend"></div>
    <div class="actions"><button id="reset" class="link-btn">Reset filters</button><button class="link-btn" data-copy>Copy link</button></div>
  </div>
</aside>

<div id="card" class="card" hidden></div>
<aside id="panel" class="panel" hidden>
  <button id="panel-close" class="icon-btn close" title="Close">×</button>
  <div id="panel-body"></div>
</aside>

<div id="lightbox" class="lb" hidden role="dialog" aria-modal="true" aria-label="Photo gallery">
  <div class="lb-top"><span id="lb-title"></span><button class="lb-btn" data-lb="close" title="Close (Esc)">×</button></div>
  <button class="lb-btn lb-nav prev" data-lb="prev" title="Previous (←)">‹</button>
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <button class="lb-btn lb-nav next" data-lb="next" title="Next (→)">›</button>
  <div class="lb-bottom"><span id="lb-cap"></span><span id="lb-count"></span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" crossorigin=""></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js" crossorigin=""></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
